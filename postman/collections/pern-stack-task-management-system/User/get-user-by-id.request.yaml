$kind: http-request
name: Get User by ID
method: GET
url: '{{baseUrl}}/user/:id'
order: 3000
description: Requires ADMIN or MODERATOR role
pathVariables:
  - key: id
    value: '{{userId}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
events:
  - listen: test
    script: |-
      const jsonData = pm.response.json();

      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response contains email field", function () {
        pm.expect(jsonData).to.have.property("email");
      });

      pm.test("Email is a valid format", function () {
        pm.expect(jsonData.email).to.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/);
      });

      pm.test("Returned user ID matches requested ID", function () {
        const requestedId = pm.variables.get("userId");
        if (requestedId && jsonData.id) {
          pm.expect(String(jsonData.id)).to.eql(String(requestedId));
        } else {
          pm.expect(jsonData).to.have.property("id");
        }
      });

      pm.test("Email matches expected user", function () {
        const expectedEmail = pm.environment.get("userEmail");
        if (expectedEmail) {
          pm.expect(jsonData.email).to.eql(expectedEmail);
        } else {
          pm.expect(jsonData.email).to.be.a("string").and.not.empty;
        }
      });
