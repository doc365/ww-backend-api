$kind: http-request
name: Create Task
method: POST
url: '{{baseUrl}}/task'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "My Task",
      "description": "Task description"
    }
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
